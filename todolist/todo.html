<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>
    <link rel="stylesheet" href="todolist.css">
</head>
<body>
    <main class="page">
        <section class="page-header">
            <div>
                <p class="eyebrow">Dashboard</p>
                <h1>Product List</h1>
            </div>
            <button class="btn btn-primary" onclick="createProductForm()">Create Product</button>
        </section>

        <form id="createProductForm" class="product-form"></form>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Category</th>
                        <th>Stock</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="Products-data"></tbody>
            </table>
        </div>
    </main>

    <script src="todo.js"></script>
</body>
</html>
