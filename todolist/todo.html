<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>
    <link rel="stylesheet" href="todolist.css">
</head>
<body>
    <main class="page">
        <h1>Product List</h1>
        <button onclick="createProductForm()">Create Product</button>
        <form id="createProductForm"></form>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>id</th>
                        <th>name</th>
                        <th>price</th>
                        <th>category</th>
                        <th>stock</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="Products-data"></tbody>
            </table>
        </div>
    </main>

    <script src="todo.js"></script>
</body>
</html>
